<div class="contact-container" [class.mobile]="navService.isMobile()">
  <div class="content-wrapper">
    <div class="section-header">
      <h2 class="section-title">Get In Touch</h2>
      <div class="title-underline"></div>
    </div>

    <div class="contact-content">
      <div class="contact-info">
        <h3 class="info-title">Let's Connect</h3>
        <p class="info-description">{{ subtitle() }}</p>

        <div class="social-links">
          @for (social of socialLinks(); track social.label) {
            @if (social.action === 'copy') {
              <div class="social-link email-link" [class.copied]="copiedEmail()">
                <button mat-icon-button class="social-button">
                  <mat-icon>{{ social.icon }}</mat-icon>
                </button>
                <span>{{ social.label }}</span>
                <button mat-icon-button class="copy-icon-button"
                        (click)="copyEmail(social.value)"
                        [disabled]="copiedEmail()">
                  <mat-icon class="copy-icon" [class.animate]="copiedEmail()">
                    {{ copiedEmail() ? 'check' : 'content_copy' }}
                  </mat-icon>
                </button>
                @if (copiedEmail()){
                  <span class="copied-text">Copied</span>
                }
              </div>
            } @else {
              <a [href]="social.link" target="_blank" rel="noopener" class="social-link">
                <button mat-icon-button class="social-button">
                  <mat-icon>{{ social.icon }}</mat-icon>
                </button>
                <span>{{ social.label }}</span>
              </a>
            }
          }
        </div>

        <div class="contact-details">
          <div class="detail-item">
            <mat-icon>location_on</mat-icon>
            <span>{{ location() }}</span>
          </div>
          <div class="detail-item">
            <mat-icon>schedule</mat-icon>
            <span>{{ availability() }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
